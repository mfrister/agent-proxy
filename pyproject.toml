[project]
name = "agent-proxy"
version = "0.1.0"
# 3.12.8/3.13.1 fixed asyncio's happy-eyeballs impl under eager task
# factories (cpython#124309), which addon.py's happy_eyeballs_delay
# support relies on inside mitmproxy.
requires-python = ">=3.12.8,!=3.13.0"
dependencies = [
    "mitmproxy>=10",
    "flask>=3",
    "pyyaml>=6",
    "textual>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["test_addon.py", "test_registries.py", "test_functional.py"]
