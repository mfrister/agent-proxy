# Path to a YAML file containing secret values (key: value pairs).
# Keep this file outside the codebase so agents never see real credentials.
# Example: secrets_file: /home/user/.config/agent-proxy/secrets.yaml
#
# Credentials support ${KEY} references resolved from that file:
#   credentials:
#     - host: api.openai.com
#       header: Authorization
#       fake_value: "Bearer sk-fake"
#       real_value: "${OPENAI_API_KEY}"

# management_port: 8082   # port for the management API (default: 8082)

# Delay in seconds before racing the next address family when connecting
# upstream (RFC 8305 "happy eyeballs"). Works around mitmproxy trying resolved
# addresses strictly sequentially, which stalls for the full OS connect
# timeout on hosts whose AAAA record points at a blackholed IPv6 path
# (https://github.com/mitmproxy/mitmproxy/issues/8088). Set to 0 to disable.
# Requires a proxy restart to change; not reloaded on SIGHUP.
#
# happy_eyeballs_delay: 0.25

allowed_hosts:
  - host: api.anthropic.com
  - host: platform.claude.com

# Service presets. Bare names enable read-only package-registry rule sets
# (restricted hosts): each allows the GET/HEAD traffic its ecosystem needs —
# pinned hosts, anchored URL patterns, query-param and request-header
# allowlists — while blocking everything else with a 403.
# Registry presets: go, npm, docker, ghcr, pypi, crates
#
# Credential presets (github, gitlab) broker an API token: the CLI in the
# sandbox is configured with the fake token and the proxy swaps in the real
# one. Self-hosted services (gitlab) take the instance host in the entry.
# Set allow_host: false to broker the token without allowlisting the host.
# Threat model and per-preset details: docs/service-presets.md
#
# services:
#   - go
#   - npm
#   - service: github
#     fake_value: "ghp_0000000000000000000000000000000000fake"
#     real_value: "${GITHUB_TOKEN}"
#   - service: gitlab
#     host: gitlab.example.com
#     fake_value: "glpat-00000000000000fake"
#     real_value: "${GITLAB_TOKEN}"

# Custom restricted hosts use the same rule engine. Patterns are matched with
# fullmatch and must be bounded (no *, + or {n,}). Omitting `query` on a rule
# forbids query strings entirely.
#
# restricted_hosts:
#   - host: artifacts.internal.example.com
#     rules:
#       - methods: [GET, HEAD]
#         path: "/repo/[a-z0-9-]{1,64}/[a-zA-Z0-9._-]{1,128}"
#         query:
#           version: "[a-z0-9.]{1,32}"
#     request_headers: [authorization]   # extras beyond the base header allowlist
#     allow_response_cookies: []         # default for restricted hosts: strip all
